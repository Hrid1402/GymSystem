paths:
  /api/payments/create-preference:
    post:
      summary: Crear preferencia de pago en Mercado Pago Checkout Pro
      description: |
        Genera una orden y preferencia de pago en Mercado Pago para la suscripción a un plan.
        
        **Restricciones y exclusiones de pago:**
        - Solo clientes activos (`CLIENT`) pueden adquirir planes.
        - Se excluyen deliberadamente los métodos de transferencia bancaria (`bank_transfer` / Yape) y tickets de agentes en efectivo (`ticket` / PagoEfectivo), restringiendo el cobro exclusivamente a tarjetas de crédito y débito.
        - Retorna las URLs de redirección (`init_point` y `sandbox_init_point`) y el identificador de orden (`PAY-XXXX`).
      tags: [Pagos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id:
                  type: string
                  description: Identificador del plan a pagar.
                  example: PLN-q3F9xT2_kLmA
      responses:
        '200':
          description: Preferencia creada exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  preference_id:
                    type: string
                    example: '2293418550596217-101117-...'
                  checkout_url:
                    type: string
                    example: 'https://www.mercadopago.com.pe/checkout/v1/redirect?pref_id=...'
                  init_point:
                    type: string
                    example: 'https://www.mercadopago.com.pe/checkout/v1/redirect?pref_id=...'
                  sandbox_init_point:
                    type: string
                    example: 'https://sandbox.mercadopago.com.pe/checkout/v1/redirect?pref_id=...'
                  payment:
                    $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Token no provisto o inválido.
        '403':
          description: Solo clientes activos pueden generar órdenes de pago.
        '404':
          description: Plan no encontrado o no disponible.
        '409':
          description: El cliente ya cuenta con una membresía activa vigente.

  /api/payments/webhook:
    post:
      summary: Webhook oficial de Mercado Pago
      description: |
        Endpoint público que recibe notificaciones automáticas y en tiempo real desde los servidores de Mercado Pago (Webhooks / IPN).
        Verifica la autenticidad de la transacción consultando directamente la API de Mercado Pago.
        Si el estado del pago es `approved`, se procede a la activación automática e idempotente de la membresía del cliente correspondiente.
      tags: [Pagos]
      parameters:
        - in: query
          name: topic
          required: false
          schema:
            type: string
          description: Tipo de notificación (ej. payment).
        - in: query
          name: id
          required: false
          schema:
            type: string
          description: Identificador del pago en los servidores de Mercado Pago.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: payment
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      example: '1234567890'
      responses:
        '200':
          description: Notificación recibida y procesada correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: approved

  /api/payments/me:
    get:
      summary: Listar mis pagos (Cliente)
      description: Retorna el historial de pagos e intentos de cobro del cliente autenticado.
      tags: [Pagos]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Historial de transacciones de pago.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
        '401':
          description: Token ausente o inválido.

  /api/payments/{id}:
    get:
      summary: Consultar estado de un pago
      description: Retorna los detalles, monto y estado actual de una transacción de pago por su ID.
      tags: [Pagos]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: PAY-q3F9xT2_kLmA
      responses:
        '200':
          description: Datos de la transacción de pago.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment:
                    $ref: '#/components/schemas/Payment'
        '401':
          description: Token no provisto o inválido.
        '404':
          description: Registro de pago no encontrado.
