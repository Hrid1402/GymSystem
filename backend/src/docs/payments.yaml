paths:
  /api/payments/create-order:
    post:
      summary: Crear orden de pago en Culqi Checkout v4
      description: |
        Genera una orden de pago en Culqi Checkout v4 para la suscripción a un plan deportivo.
        
        **Características y seguridad:**
        - Solo clientes activos (`CLIENT`) pueden adquirir planes.
        - Retorna el `order_id`, el monto en céntimos y la moneda oficial (PEN).
        - Soporta pagos mediante tarjetas de crédito y débito, Yape, banca móvil y PagoEfectivo bajo certificación PCI-DSS.
      tags: [Pagos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id:
                  type: string
                  description: Identificador del plan a pagar.
                  example: PLN-q3F9xT2_kLmA
      responses:
        '200':
          description: Orden de Culqi creada exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id:
                    type: string
                    example: 'ord_live_123456789'
                  amount:
                    type: number
                    example: 9000
                  currency:
                    type: string
                    example: 'PEN'
                  payment:
                    $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Token no provisto o inválido.
        '403':
          description: Solo clientes activos pueden generar órdenes de pago.
        '404':
          description: Plan no encontrado o no disponible.
        '409':
          description: El cliente ya cuenta con una membresía activa vigente.

  /api/payments/cash-charge:
    post:
      summary: Registrar cobro presencial en efectivo en mostrador
      description: |
        Registra un pago en dinero físico (efectivo) realizado en el mostrador del gimnasio por un cliente.
        Disponible exclusivamente para personal de Recepción (`RECEPTIONIST`) o Gerencia (`MANAGER`).
        
        **Acciones automáticas:**
        - Valida que el cliente no tenga una membresía activa vigente (prevención anti-duplicados).
        - Registra el pago en estado `approved` con método `EFECTIVO`.
        - Activa de inmediato la membresía del cliente para habilitar su acceso biométrico/QR.
        - Emite la Boleta de Venta o Factura Electrónica SUNAT (código de medio de pago 008).
      tags: [Pagos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, plan_id]
              properties:
                client_id:
                  type: string
                  description: ID del cliente que realiza el pago.
                  example: USR-cli123456
                plan_id:
                  type: string
                  description: ID del plan comercial a contratar.
                  example: PLN-mensual-01
                billing_details:
                  type: object
                  properties:
                    tipo_doc:
                      type: string
                      enum: ['01', '03']
                      example: '03'
                    num_doc:
                      type: string
                      example: '72345678'
                    rzn_social:
                      type: string
                      example: 'JUAN PEREZ'
      responses:
        '201':
          description: Cobro en efectivo registrado y membresía activada exitosamente.
        '400':
          description: Datos inválidos o cuenta de cliente desactivada.
        '401':
          description: No autenticado.
        '403':
          description: Solo recepción y gerencia pueden registrar cobros en efectivo.
        '404':
          description: Cliente o plan no encontrado.
        '409':
          description: El cliente ya cuenta con una membresía activa vigente.

  /api/payments/daily-summary:
    get:
      summary: Resumen del día de cobros en caja (Efectivo vs Online)
      description: |
        Retorna la recaudación total del día actual (zona horaria Lima), desglosando el dinero físico cobrado en efectivo en mostrador frente a los pagos digitales en línea (Culqi).
      tags: [Pagos]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resumen financiero diario de caja.
        '401':
          description: No autenticado.
        '403':
          description: Requiere rol MANAGER o RECEPTIONIST.

  /api/payments/charge:
    post:
      summary: Procesar cobro con token de Culqi Checkout v4
      description: |
        Procesa el cargo final mediante la pasarela Culqi utilizando el token seguro generado en el cliente (`tkn_...`).
        Al confirmarse el cobro (`venta_exitosa` / `approved`), se activa inmediatamente la membresía del usuario y se emite de manera desacoplada el comprobante de pago electrónico ante SUNAT (Boleta o Factura UBL 2.1).
      tags: [Pagos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id, token_id]
              properties:
                plan_id:
                  type: string
                  example: PLN-q3F9xT2_kLmA
                token_id:
                  type: string
                  example: tkn_live_1234567890
                order_id:
                  type: string
                  example: ord_live_1234567890
      responses:
        '200':
          description: Cobro procesado y membresía activada exitosamente.
        '400':
          description: Error al procesar el cargo en Culqi.

  /api/payments/webhook:
    post:
      summary: Webhook oficial de Culqi
      description: |
        Endpoint público que recibe notificaciones automáticas y en tiempo real desde los servidores de Culqi para eventos como `order.status.changed`.
      tags: [Pagos]
      responses:
        '200':
          description: Notificación recibida y procesada correctamente.

  /api/payments/me:
    get:
      summary: Historial de pagos del cliente autenticado
      description: Retorna el listado cronológico de pagos realizados por el cliente actual.
      tags: [Pagos]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pagos del usuario.

  /api/payments/{id}:
    get:
      summary: Consultar estado de una orden de pago por ID
      tags: [Pagos]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID del pago (PAY-XXXX).
      responses:
        '200':
          description: Detalle del estado del pago.
