paths:
  /api/plans:
    get:
      summary: Listar planes activos
      description: "Endpoint público, no requiere autenticación. Retorna únicamente los planes marcados como activos (is_active: true), ordenados por precio ascendente."
      tags: [Planes]
      responses:
        '200':
          description: Lista de planes disponibles para compra o suscripción.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'
    post:
      summary: Crear un nuevo plan de membresía
      description: |
        Acceso exclusivo para administradores con rol `MANAGER`.
        **Reglas y limitaciones de validación:**
        - **Nombre:** Obligatorio, entre 1 y 255 caracteres.
        - **Descripción:** **Obligatoria**, entre 1 y 1000 caracteres.
        - **Precio:** Obligatorio, valor numérico en Soles (PEN) con IGV incluido. **Mínimo permitido: S/ 5.00**, máximo: S/ 99,999,999.
        - **Duración en días:** Obligatorio, número entero positivo mayor a 0 y máximo 3650 días (10 años).
        - **Estado (`is_active`):** Opcional, por defecto `true`.
      tags: [Planes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, price, duration_days]
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: Nombre comercial del plan.
                  example: Plan Semestral Vip
                description:
                  type: string
                  maxLength: 1000
                  description: Descripción detallada de beneficios del plan.
                  example: Acceso total a todas las sedes, máquinas, pesas y casillero personal por 180 días.
                price:
                  type: number
                  minimum: 5
                  maximum: 99999999
                  description: Precio en Soles (PEN) con IGV incluido (mínimo S/ 5.00).
                  example: 449.90
                duration_days:
                  type: integer
                  minimum: 1
                  maximum: 3650
                  description: Duración total del plan en días calendario.
                  example: 180
                is_active:
                  type: boolean
                  description: Estado de disponibilidad (opcional, por defecto true).
                  example: true
      responses:
        '201':
          description: Plan creado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Token no provisto o inválido.
        '403':
          description: No autorizado. Solo los Gerentes (`MANAGER`) pueden crear planes.
        '409':
          description: Ya existe un plan registrado con ese nombre.

  /api/plans/all:
    get:
      summary: Listar todos los planes (incluyendo inactivos)
      description: Acceso exclusivo para el rol `MANAGER`. Retorna el catálogo completo de planes con su estado real (`is_active`).
      tags: [Planes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Catálogo total de planes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'
        '401':
          description: Token no provisto o inválido.
        '403':
          description: Acceso denegado. Solo accesible para Gerentes (`MANAGER`).

  /api/plans/{id}:
    get:
      summary: Consultar un plan activo por su ID
      description: "Endpoint público. Si el plan está inactivo (is_active: false), retornará 404 para proteger compras deshabilitadas."
      tags: [Planes]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: PLN-q3F9xT2_kLmA
      responses:
        '200':
          description: Datos del plan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: '#/components/schemas/Plan'
        '404':
          description: Plan no encontrado o no disponible.
    patch:
      summary: Actualizar un plan existente
      description: |
        Acceso exclusivo para `MANAGER`. Permite actualizar de forma parcial los atributos del plan.
        Para suspender nuevas compras sin romper membresías históricas, cambie `is_active` a `false`.
      tags: [Planes]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: PLN-q3F9xT2_kLmA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 255, example: Plan Anual Black }
                description: { type: string, maxLength: 1000, example: Acceso libre por 365 días + toalla y asesoría. }
                price: { type: number, minimum: 5, example: 799.00 }
                duration_days: { type: integer, minimum: 1, example: 365 }
                is_active: { type: boolean, example: false }
      responses:
        '200':
          description: Plan actualizado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Token no provisto o expirado.
        '403':
          description: Solo los Gerentes pueden editar planes.
        '404':
          description: Plan no encontrado.
        '409':
          description: Ya existe otro plan con ese nombre.
    delete:
      summary: Eliminar permanentemente un plan
      description: |
        Acceso exclusivo para `MANAGER`.
        **Restricción de integridad referencial:**
        Si el plan cuenta con membresías históricas, clientes inscritos o registros de pago asociados, **no se permite la eliminación física** y el servidor responderá con código `409 Conflict`.
        En tales casos, se recomienda desactivar el plan (`is_active: false`) para impedir nuevas ventas sin alterar el historial.
      tags: [Planes]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: PLN-q3F9xT2_kLmA
      responses:
        '204':
          description: Plan eliminado de forma permanente.
        '401':
          description: Token ausente o inválido.
        '403':
          description: Solo el rol Gerente puede eliminar planes.
        '404':
          description: Plan no encontrado.
        '409':
          description: |
            No se puede eliminar el plan debido a que cuenta con membresías o transacciones asociadas en la base de datos (Error 23503).
            Mensaje: "No se puede eliminar este plan porque cuenta con clientes o membresías asociadas. Te sugerimos desactivarlo en su lugar."
