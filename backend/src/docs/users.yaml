paths:
  /api/users:
    get:
      summary: Listar usuarios del sistema
      description: |
        Acceso restringido a Gerentes (`MANAGER`) y Recepcionistas (`RECEPTIONIST`).
        - Un Gerente puede ver a todos los usuarios (clientes, recepcionistas y gerentes).
        - Un Recepcionista solo puede ver a usuarios con rol `CLIENT`.
      tags: [Usuarios]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuarios registrados ordenados cronológicamente descendente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          description: Token no provisto o inválido.
        '403':
          description: Solo personal autorizado puede consultar el listado de usuarios.
    post:
      summary: Crear un nuevo usuario por parte del personal
      description: |
        Acceso restringido a `MANAGER` y `RECEPTIONIST`.
        - Un Recepcionista **solo puede crear clientes** (`CLIENT`).
        - Un Gerente puede asignar cualquier rol (`CLIENT`, `RECEPTIONIST`, `MANAGER`).
        
        **Validaciones y limitaciones aplicadas:**
        - **Nombres y Apellidos:** Obligatorios, longitud máx. 100 caracteres. Solo letras, tildes y espacios.
        - **Esquema Multi-Documento:** `tipo_documento` (`dni`, `carnet_extranjeria`, `pasaporte`) y `numero_documento`.
          - **DNI:** Exactamente 8 dígitos numéricos.
          - **Carné de Extranjería (C.E.):** De 9 a 12 dígitos numéricos.
          - **Pasaporte:** De 6 a 12 caracteres alfanuméricos.
          - Se valida unicidad previa del número de documento.
        - **Celular:** Opcional. 9 dígitos numéricos.
        - **Contraseña:** Mínimo obligatorio de 8 caracteres.
      tags: [Usuarios]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, last_name, tipo_documento, numero_documento]
              properties:
                email: { type: string, format: email, example: nuevo.usuario@ejemplo.com }
                password: { type: string, minLength: 8, example: ClaveTemporal123 }
                first_name: { type: string, maxLength: 100, example: Roberto }
                last_name: { type: string, maxLength: 100, example: Silva }
                tipo_documento:
                  type: string
                  enum: [dni, carnet_extranjeria, pasaporte]
                  description: Tipo de documento de identidad del cliente.
                  example: dni
                numero_documento:
                  type: string
                  description: Número de documento de identidad formateado según el tipo especificado.
                  example: '71829304'
                phone: { type: string, pattern: '^\d{9}$', description: "Opcional. 9 dígitos.", example: '912345678' }
                role:
                  type: string
                  enum: [CLIENT, RECEPTIONIST, MANAGER]
                  description: "Opcional (por defecto CLIENT). Solo los gerentes pueden asignar roles distintos de CLIENT."
                  example: RECEPTIONIST
      responses:
        '201':
          description: Usuario creado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Token no provisto o inválido.
        '403':
          description: Un recepcionista intentó crear un usuario con rol distinto de CLIENT.
        '409':
          description: Ya existe un usuario registrado con ese correo o número de documento.

  /api/users/search:
    get:
      summary: Búsqueda rápida de clientes para control de acceso
      description: |
        Permite a Gerentes y Recepcionistas buscar clientes en recepción mediante su número de documento (`numero_documento`) para validar su ingreso manual.
      tags: [Usuarios]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: Número de documento (DNI, C.E. o Pasaporte) del cliente a consultar.
          example: "71234567"
      responses:
        '200':
          description: Clientes encontrados que coinciden con el número de documento proporcionado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '400':
          description: El término de búsqueda está vacío o no es válido.
        '401':
          description: Token no provisto o inválido.
        '403':
          description: Acceso exclusivo para personal del gimnasio (Recepcionistas y Gerentes).

  /api/users/pending-face:
    get:
      summary: Listar clientes pendientes de registro facial
      description: |
        Retorna la lista de clientes (`CLIENT`) que **aún no tienen** un embedding facial guardado en `client_facials`.
        Incluye los campos de identidad `tipo_documento` y `numero_documento`.
      tags: [Usuarios, Reconocimiento Facial]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de clientes sin registro biométrico.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, example: usr_cliente_01 }
                    first_name: { type: string, example: Carlos }
                    last_name: { type: string, example: Mendoza Pérez }
                    tipo_documento: { type: string, example: dni }
                    numero_documento: { type: string, example: '71234567' }
                    phone: { type: string, example: '987654321' }
        '401':
          description: Token no provisto o inválido.
        '403':
          description: Acceso exclusivo para Recepcionistas y Gerentes.
        '500':
          description: Error interno al consultar el estado biométrico.

  /api/users/registered-face:
    get:
      summary: Listar clientes con registro facial existente
      description: |
        Retorna la lista de clientes (`CLIENT`) que **ya cuentan** con un embedding facial activo para permitir su actualización biométrica.
      tags: [Usuarios, Reconocimiento Facial]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de clientes con datos biométricos registrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, example: usr_cliente_04 }
                    first_name: { type: string, example: Jon }
                    last_name: { type: string, example: Doe Smith }
                    tipo_documento: { type: string, example: carnet_extranjeria }
                    numero_documento: { type: string, example: '000123456' }
                    phone: { type: string, example: '955443322' }
        '401':
          description: Token no provisto o inválido.
        '403':
          description: Acceso exclusivo para Recepcionistas y Gerentes.

  /api/users/register-face:
    post:
      summary: Registrar o actualizar embedding de reconocimiento facial
      description: |
        Guarda el vector embedding biométrico (extraído desde `@vladmandic/human`) para un cliente específico.
        Valida que el rostro no presente alta similitud de coseno con otro cliente registrado (prevención de suplantación).
      tags: [Reconocimiento Facial]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, embedding]
              properties:
                userId:
                  type: string
                  description: ID del cliente al que se asociará la biometría.
                  example: usr_cliente_01
                embedding:
                  type: array
                  items:
                    type: number
                  description: Vector numérico continuo representando las características faciales.
      responses:
        '200':
          description: Rostro registrado o actualizado con éxito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Rostro registrado correctamente }
        '400':
          description: El rostro ya está registrado a nombre de otro cliente o los datos son inválidos.
        '401':
          description: Token no provisto o inválido.
        '403':
          description: Sin permisos para gestionar reconocimientos faciales.

  /api/users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        example: usr_cliente_01
    get:
      summary: Consultar detalle de usuario por ID
      description: |
        Cualquier usuario autenticado puede ver su propio perfil.
        Un Gerente puede ver el perfil de cualquier usuario.
        Un Recepcionista puede ver únicamente perfiles de clientes.
      tags: [Usuarios]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Información detallada del usuario.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Token ausente o inválido.
        '403':
          description: No cuenta con permisos para ver este usuario.
        '404':
          description: Usuario no encontrado.
    patch:
      summary: Actualizar campos del perfil de un usuario
      description: |
        Permite actualizar información personal según el rol del solicitante.
        - **El propio usuario:** `first_name`, `last_name`, `phone`.
        - **Recepcionista sobre un cliente:** Mismos campos más `tipo_documento` y `numero_documento`.
        - **Gerente sobre otro usuario:** Mismos campos más `tipo_documento`, `numero_documento`, `role` e `is_active`.
        - **Gerente sobre sí mismo:** No puede alterar su propio rol ni desactivarse.
      tags: [Usuarios]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                first_name: { type: string, maxLength: 100, example: Roberto Carlos }
                last_name: { type: string, maxLength: 100, example: Silva Paredes }
                tipo_documento: { type: string, enum: [dni, carnet_extranjeria, pasaporte] }
                numero_documento: { type: string, example: '71829304' }
                phone: { type: string, nullable: true, example: '912345678' }
                role: { type: string, enum: [CLIENT, RECEPTIONIST, MANAGER] }
                is_active: { type: boolean, description: "false desactiva la cuenta e impide el inicio de sesión." }
      responses:
        '200':
          description: Usuario actualizado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Token no provisto o expirado.
        '403':
          description: No cuenta con permisos para editar los campos especificados.
        '404':
          description: Usuario no encontrado.
        '409':
          description: El número de documento especificado ya pertenece a otro usuario.

  /api/users/{id}/email:
    patch:
      summary: Cambiar correo electrónico de una cuenta
      description: |
        Permite actualizar el correo electrónico en la base de datos y en el servicio de autenticación.
        - Al cambiar **su propio correo**, es obligatorio enviar `current_password`.
        - Gerentes y recepcionistas autorizados pueden cambiar el correo de terceros sin enviar la contraseña actual.
      tags: [Usuarios]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: usr_cliente_01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: nuevo.correo@ejemplo.com }
                current_password: { type: string, description: "Obligatorio solo al cambiar el correo propio." }
      responses:
        '200':
          description: Correo electrónico actualizado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Token no provisto o inválido.
        '403':
          description: No cuenta con permisos para modificar el correo de este usuario.
        '404':
          description: Usuario no encontrado.
        '409':
          description: Ya existe una cuenta registrada con ese correo electrónico.

  /api/users/{id}/password:
    patch:
      summary: Cambiar contraseña de una cuenta
      description: |
        Permite actualizar la contraseña de acceso.
        - Al cambiar **su propia contraseña**, es obligatorio enviar `current_password`.
        - La nueva contraseña (`new_password`) debe contener al menos 8 caracteres.
      tags: [Usuarios]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: usr_cliente_01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, minLength: 8, example: MiNuevaClave2026 }
                current_password: { type: string, description: "Obligatorio al cambiar la propia contraseña." }
      responses:
        '200':
          description: Contraseña actualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Contraseña actualizada correctamente
        '400':
          description: La contraseña actual es incorrecta o no cumple con el mínimo de 8 caracteres.
        '401':
          description: Token no provisto o inválido.
        '403':
          description: No cuenta con permisos para cambiar la contraseña de este usuario.
        '404':
          description: Usuario no encontrado.