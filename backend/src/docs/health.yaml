paths:
  /api/health:
    get:
      summary: Verificación de estado del servidor (Health Check)
      description: Retorna el estado del servicio Node.js/Express, métricas de memoria y conectividad con la base de datos PostgreSQL.
      tags: [Sistema]
      responses:
        '200':
          description: La API se encuentra en línea y la base de datos responde activamente.
        '503':
          description: Servicio degradado (el servidor está encendido, pero no hay conexión con PostgreSQL).
