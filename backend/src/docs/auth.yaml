paths:
  /api/auth/login:
    post:
      summary: Iniciar sesión
      description: |
        Autentica a un usuario mediante su correo electrónico y contraseña.
        Retorna los tokens de sesión (`access_token` y `refresh_token`) y el perfil del usuario.
        Utilice el `access_token` como Bearer token en el header `Authorization` para consumir los endpoints protegidos.
      tags: [Autenticación]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  description: Correo electrónico registrado del usuario.
                  example: cliente@ejemplo.com
                password:
                  type: string
                  description: Contraseña de la cuenta.
                  example: miclave123
      responses:
        '200':
          description: Inicio de sesión exitoso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string, description: Token JWT para autenticar peticiones. }
                  refresh_token: { type: string, description: Token para refrescar la sesión. }
                  expires_at: { type: integer, description: Marca de tiempo Unix (segundos) de expiración. }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Correo electrónico o contraseña incorrectos.
        '403':
          description: La cuenta no cuenta con perfil asociado o ha sido desactivada por la administración.

  /api/auth/register:
    post:
      summary: Registro público de nuevo cliente
      description: |
        Registra una nueva cuenta de cliente en el sistema mediante el esquema de identidad multi-documento.
        **Reglas y limitaciones de validación:**
        - **Nombres y Apellidos:** Obligatorios, de 1 a 100 caracteres. Solo se admiten letras (incluyendo tildes y diéresis) y espacios.
        - **Esquema de Documento:** `tipo_documento` (`dni`, `carnet_extranjeria`, `pasaporte`) y `numero_documento` obligatorios.
          - **DNI:** Exactamente 8 dígitos numéricos.
          - **Carné de Extranjería (C.E.):** De 9 a 12 dígitos numéricos.
          - **Pasaporte:** De 6 a 12 caracteres alfanuméricos.
          - Se valida la unicidad previa del número de documento.
        - **Celular:** Opcional. Si se envía, debe tener exactamente 9 dígitos numéricos iniciando con 9.
        - **Fecha de Nacimiento (`date_of_birth`):** **Obligatoria**, en formato `AAAA-MM-DD`. Debe pertenecer al rango (año >= 1900) y **el usuario debe certificar mayoría de edad (al menos 18 años cumplidos a la fecha actual)**.
        - **Contraseña:** Mínimo obligatorio de 8 caracteres.
        - **Rol:** Todo autoregistro asigna automáticamente el rol `CLIENT`.
      tags: [Autenticación]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, last_name, tipo_documento, numero_documento]
              properties:
                email:
                  type: string
                  format: email
                  description: Correo electrónico personal único.
                  example: ana.torres@ejemplo.com
                password:
                  type: string
                  minLength: 8
                  description: Contraseña segura (mínimo 8 caracteres).
                  example: MiPasswordSeguro123
                first_name:
                  type: string
                  maxLength: 100
                  description: Nombres del cliente (solo letras y espacios).
                  example: Ana María
                last_name:
                  type: string
                  maxLength: 100
                  description: Apellidos del cliente (solo letras y espacios).
                  example: Torres Mendoza
                tipo_documento:
                  type: string
                  enum: [dni, carnet_extranjeria, pasaporte]
                  description: Tipo de documento de identidad oficial.
                  example: dni
                numero_documento:
                  type: string
                  description: Número correspondiente al documento de identidad.
                  example: '72345678'
                phone:
                  type: string
                  pattern: '^9\d{8}$'
                  description: Opcional. Celular de 9 dígitos iniciando en 9.
                  example: '987654321'
                date_of_birth:
                  type: string
                  format: date
                  description: Obligatoria. Fecha de nacimiento en formato AAAA-MM-DD. Debe ser mayor de edad (>= 18 años).
                  example: '1998-05-20'
      responses:
        '201':
          description: Cuenta de cliente creada exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Conflicto. Ya existe un usuario registrado con ese correo electrónico o número de documento.

  /api/auth/me:
    get:
      summary: Obtener perfil del usuario autenticado
      description: Retorna el perfil y los datos del usuario asociado al token Bearer provisto.
      tags: [Autenticación]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401':
          description: Token no provisto, inválido o expirado.
        '403':
          description: Cuenta desactivada o sin perfil en el sistema.

  /api/auth/forgot-password:
    post:
      summary: Solicitar recuperación de contraseña
      description: |
        Envía un enlace de recuperación al correo electrónico registrado.
        Por seguridad, si el correo no existe en el sistema, la API responde con un mensaje neutral para no filtrar existencia de cuentas.
      tags: [Autenticación]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: Correo de la cuenta a recuperar.
                  example: ana.torres@ejemplo.com
      responses:
        '200':
          description: Solicitud procesada correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Si el correo electrónico está registrado, recibirás un enlace para restablecer tu contraseña.
                  action_link:
                    type: string
                    description: Enlace generado como respaldo si el proveedor SMTP gratuito presenta limitación de tasa.
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/auth/reset-password:
    post:
      summary: Restablecer contraseña mediante token de recuperación
      description: |
        Permite actualizar la contraseña de la cuenta una vez que el usuario ha ingresado a través del enlace de recuperación provisto por correo electrónico.
      tags: [Autenticación]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 8
                  description: Nueva contraseña (mínimo 8 caracteres).
                  example: NuevaClaveSegura2026
      responses:
        '200':
          description: Contraseña restablecida con éxito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Contraseña actualizada correctamente
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Token de recuperación ausente o expirado.