paths:
  /api/memberships:
    post:
      summary: Enroll a client in a plan
      description: |
        Creates an ACTIVE membership that starts today and lasts the plan's `duration_days`.

        - **Client:** enrolls themselves. Send only `plan_id`. Sending another user's `user_id` returns 403.
        - **Receptionist or manager:** enrolls a client directly. `user_id` is required.

        A client can only have one ACTIVE membership at a time. To enroll in another plan, cancel the current membership first, otherwise the request returns 409.
      tags: [Memberships]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: string, example: PLN-q3F9xT2_kLmA }
                user_id: { type: string, description: "Required for staff. Ignored or rejected for clients.", example: USR-q3F9xT2_kLmA }
      responses:
        '200':
          description: |
            Para clientes: Retorna la preferencia de Checkout Pro de Mercado Pago para realizar el pago.
            Una vez pagado y confirmado por webhook, la membresía se activa automáticamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_required:
                    type: boolean
                    example: true
                  preference_id:
                    type: string
                    example: '2293418550596217-101117-...'
                  init_point:
                    type: string
                    example: 'https://www.mercadopago.com.pe/checkout/v1/redirect?pref_id=...'
                  sandbox_init_point:
                    type: string
                    example: 'https://sandbox.mercadopago.com.pe/checkout/v1/redirect?pref_id=...'
                  payment:
                    $ref: '#/components/schemas/Payment'
        '201':
          description: "Para staff (recepcionista/gerente): Membresía creada y activada directamente en el mostrador."
          content:
            application/json:
              schema:
                type: object
                properties:
                  membership:
                    $ref: '#/components/schemas/Membership'
        '400':
          description: "Fallo de validación, user_id faltante (staff), o el usuario no es un cliente activo."
        '401':
          description: Token no provisto o inválido.
        '403':
          description: Un cliente intentó inscribir a otra persona.
        '404':
          description: Usuario o plan no encontrado o inactivo.
        '409':
          description: El cliente ya tiene una membresía activa.
        '500':
          description: Error al comunicarse con la API de Mercado Pago.
    get:
      summary: List memberships
      description: Receptionist or manager only. Returns every membership, newest first. Use `user_id` to see one client's history. Memberships past their end date are marked EXPIRED before the list is returned.
      tags: [Memberships]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: user_id
          required: false
          schema:
            type: string
          description: Only return this client's memberships.
          example: USR-q3F9xT2_kLmA
      responses:
        '200':
          description: List of memberships.
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberships:
                    type: array
                    items:
                      $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired token.
        '403':
          description: Only receptionists and managers can list all memberships.

  /api/memberships/me:
    get:
      summary: List my memberships
      description: Returns the logged-in user's memberships, newest first, including past ones. The ACTIVE one, if any, is the current membership.
      tags: [Memberships]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user's memberships.
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberships:
                    type: array
                    items:
                      $ref: '#/components/schemas/Membership'
        '401':
          description: Missing, invalid, or expired token.

  /api/memberships/{id}/cancel:
    patch:
      summary: Cancel a membership
      description: A client can cancel their own membership. A receptionist or manager can cancel any membership. Only ACTIVE memberships can be cancelled. There is no refund logic.
      tags: [Memberships]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: MEM-q3F9xT2_kLmA
      responses:
        '200':
          description: Membership cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  membership:
                    $ref: '#/components/schemas/Membership'
        '401':
          description: Missing, invalid, or expired token.
        '403':
          description: A client tried to cancel someone else's membership.
        '404':
          description: Membership not found.
        '409':
          description: Only active memberships can be cancelled.