paths:
  /api/memberships:
    post:
      summary: Inscribir cliente a un plan de membresía
      description: |
        Crea una membresía activa (`ACTIVE`) calculada a partir de la fecha actual en zona horaria peruana (`America/Lima`) durante los días correspondientes a `duration_days` del plan.
        
        **Flujo según el rol del actor:**
        - **Cliente (`CLIENT`):** Se inscribe a sí mismo enviando únicamente `plan_id`. La API genera y retorna los datos de la orden en **Culqi Checkout v4** (`order_id`, `amount`, `currency`) para procesar el cobro seguro con tarjeta, Yape o PagoEfectivo. Al confirmarse el cobro, se activa la membresía y se emite el comprobante electrónico SUNAT.
        - **Personal (`RECEPTIONIST` o `MANAGER`):** Inscribe y activa directamente la membresía para un cliente en mostrador. En este caso el campo `user_id` es obligatorio.
        
        **Regla de negocio:** Un cliente solo puede contar con **una membresía activa a la vez**. Si ya tiene una activa, debe cancelarla previamente antes de adquirir otro plan; de lo contrario, la API responderá con `409 Conflict`.
      tags: [Membresías]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id:
                  type: string
                  description: Identificador del plan a contratar.
                  example: PLN-q3F9xT2_kLmA
                user_id:
                  type: string
                  description: ID del cliente (obligatorio para staff; rechazado si un cliente intenta enviar el de un tercero).
                  example: USR-q3F9xT2_kLmA
      responses:
        '200':
          description: |
            Para clientes: Retorna la orden creada en Culqi Checkout v4 (`order_id`, `amount`, `currency`) para efectuar el cobro en el modal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_required:
                    type: boolean
                    example: true
                  order_id:
                    type: string
                    example: 'ord_live_123456789'
                  amount:
                    type: number
                    example: 9000
                  currency:
                    type: string
                    example: 'PEN'
                  payment:
                    $ref: '#/components/schemas/Payment'
        '201':
          description: "Para staff (recepción): Membresía creada y activada de inmediato en mostrador."
          content:
            application/json:
              schema:
                type: object
                properties:
                  membership:
                    $ref: '#/components/schemas/Membership'
        '400':
          description: Error de validación, user_id faltante para staff o el usuario objetivo no es un cliente activo.
        '401':
          description: Token no provisto o inválido.
        '403':
          description: El cliente intentó inscribir a otra persona distinta de sí mismo.
        '404':
          description: Usuario o plan no encontrado o deshabilitado.
        '409':
          description: El cliente ya cuenta con una membresía activa vigente.
        '500':
          description: Error en la comunicación con la pasarela de pagos Culqi.
    get:
      summary: Listar todas las membresías
      description: |
        Acceso exclusivo para `RECEPTIONIST` y `MANAGER`.
        Retorna el historial de membresías ordenado descendentemente.
        Se puede filtrar por cliente mediante el query parameter `user_id`.
        Antes de responder, el sistema ejecuta una expiración automática perezosa para marcar como `EXPIRED` aquellas membresías cuya fecha final haya caducado según la hora local de Perú.
      tags: [Membresías]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: user_id
          required: false
          schema:
            type: string
          description: Filtrar opcionalmente las membresías de un cliente específico.
          example: USR-q3F9xT2_kLmA
      responses:
        '200':
          description: Listado de membresías.
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberships:
                    type: array
                    items:
                      $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Token ausente o inválido.
        '403':
          description: Solo recepcionistas y gerentes pueden consultar todas las membresías.

  /api/memberships/me:
    get:
      summary: Consultar mis membresías (Cliente)
      description: |
        Permite al cliente autenticado consultar el estado de su membresía activa actual y su historial de suscripciones pasadas.
      tags: [Membresías]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de membresías del cliente autenticado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberships:
                    type: array
                    items:
                      $ref: '#/components/schemas/Membership'
        '401':
          description: Token ausente o inválido.

  /api/memberships/{id}/cancel:
    patch:
      summary: Cancelar una membresía activa
      description: |
        Marca el estado de la membresía como `CANCELLED` y suspende inmediatamente los derechos de acceso del usuario.
        - Un cliente solo puede cancelar su propia membresía activa.
        - El personal (recepcionistas y gerentes) puede cancelar la membresía de cualquier cliente.
        - Si la membresía ya estaba vencida o cancelada, la operación se ignora con 404 o no genera efecto.
      tags: [Membresías]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: MEM-q3F9xT2_kLmA
      responses:
        '200':
          description: Membresía cancelada exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Membresía cancelada correctamente
                  membership:
                    $ref: '#/components/schemas/Membership'
        '401':
          description: Token no provisto o inválido.
        '403':
          description: No cuenta con permisos para cancelar esta membresía.
        '404':
          description: Membresía no encontrada o no se encuentra en estado ACTIVE.
